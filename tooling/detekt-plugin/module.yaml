description: "Build plugin: detekt with Compose rules"
product: jvm/amper-plugin

dependencies:
  - $libs.detekt.cli
  # On the plugin classpath, so detekt discovers the rule set itself; no `--plugins` jar path needed.
  - $libs.compose.rules.detekt

pluginInfo:
  settingsClass: dev.justinsmith.interval.detekt.Settings

settings:
  kotlin:
    allWarningsAsErrors: true

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
