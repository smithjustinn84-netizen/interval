product: android/app

dependencies:
  - //shared
  - $libs.androidx.activity.compose
  - $libs.androidx.core.splashscreen

settings:
  compose: enabled
  android:
    namespace: dev.justinsmith.interval
    applicationId: dev.justinsmith.interval
    # Pinned rather than left to the toolchain's defaults, so a toolchain upgrade cannot silently
    # move the SDK level the app is compiled and tested against.
    compileSdk: 37
    targetSdk: 37
    minSdk: 26
    # Bump versionCode before every Play upload; versionName is the release in CHANGELOG.md.
    # tools/check_versions.py keeps both equal to the iOS project's.
    versionCode: 2
    versionName: "0.2.0"
    # Signs the release AAB (`./kotlin package -m androidApp`) with androidApp/keystore.properties
    # (gitignored: storeFile, storePassword, keyAlias, keyPassword). CI writes it from secrets.
    signing: enabled
  kotlin:
    allWarningsAsErrors: true

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
