# History: the training log, calendar and summaries, a finished workout's page, and the plan (the weekly
# goal, the routine by weekday and one-offs), which the log shows and the plan page edits.
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/compose-lib.module-template.yaml

dependencies:
  - //interval-data: exported
  - //interval-ui: exported
  # The plan's reminders: the platform's notifications, and the permission to show them.
  - //interval-platform
  # History shows Lift's sessions and the program's day too.
  - //bells-data
  - //bells-domain
  - //bells-ui

test-dependencies:
  - //interval-testing
  - //bells-testing

settings:
  compose:
    resources:
      packageName: dev.justinsmith.interval.history.resources
