# Single source of truth for dependency versions. Modules reference an entry as `$libs.a.b.c`,
# which is the alias `a-b-c` with dots for dashes. Compose itself is versioned by the toolchain
# (`$compose.*`), not here.

[versions]
androidx-activity-compose = "1.13.0"
androidx-core-splashscreen = "1.2.0"
androidx-datastore = "1.2.1"
androidx-lifecycle = "2.11.0"
# Two refs on purpose: the runtime is Google's androidx artifact and the UI is JetBrains' multiplatform
# port, released on different cadences. navigation3-ui 1.1.2 was built against navigation3-runtime 1.1.7.
androidx-navigation3-runtime = "1.1.7"
androidx-navigation3-ui = "1.1.2"
# Keep sqlite (the bundled driver) at the version room-runtime resolves: `./kotlin show dependencies -m shared`.
androidx-room = "2.8.5"
androidx-sqlite = "2.6.2"
# The nav suite must match the toolchain's material3 (1.12.0-alpha03); a newer one drags material3 along.
compose-material3-adaptive = "1.3.0"
compose-material3-navigation-suite = "1.12.0-alpha03"
# compose-rules 0.6.8 is built against detekt 2.0.0-alpha.6; bump the two together.
compose-rules = "0.6.8"
# Headless components drawn from Interval tokens. One version for every composeunstyled-* module.
composeunstyled = "2.10.1"
detekt = "2.0.0-alpha.6"
kermit = "2.2.0"
koin = "4.2.2"
kotlinx-coroutines = "1.11.0"
ktlint = "1.8.0"
logback = "1.6.5"
slf4j = "2.0.20"
turbine = "1.2.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidx-datastore" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3-runtime" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3-ui" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
compose-material3-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "compose-material3-adaptive" }
compose-material3-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "compose-material3-navigation-suite" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }
composeunstyled-dialog = { module = "com.composables:composeunstyled-dialog", version.ref = "composeunstyled" }
composeunstyled-dropdown-menu = { module = "com.composables:composeunstyled-dropdown-menu", version.ref = "composeunstyled" }
composeunstyled-modal-bottom-sheet = { module = "com.composables:composeunstyled-modal-bottom-sheet", version.ref = "composeunstyled" }
composeunstyled-text-field = { module = "com.composables:composeunstyled-text-field", version.ref = "composeunstyled" }
composeunstyled-toggle-switch = { module = "com.composables:composeunstyled-toggle-switch", version.ref = "composeunstyled" }
detekt-cli = { module = "dev.detekt:detekt-cli", version.ref = "detekt" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
ktlint-rule-engine = { module = "com.pinterest.ktlint:ktlint-rule-engine", version.ref = "ktlint" }
ktlint-ruleset-standard = { module = "com.pinterest.ktlint:ktlint-ruleset-standard", version.ref = "ktlint" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
