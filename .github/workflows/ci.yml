name: CI

# `main`, version tags and pull requests, and every night. A jj bookmark pushed without a PR gets no run
# of its own: start one from the Actions tab or with `gh workflow run CI --ref <bookmark>`, which runs every
# iOS test. Pushing every branch as well as its PR ran everything twice.
on:
  push:
    branches: [main]
    # A version tag also packages the signed Android bundle (the `release` job). Path filters are not
    # evaluated for tags, so a tag always runs.
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'journeys/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'journeys/**']
  workflow_dispatch:
  # Every iOS test, nightly on `main`: a push runs only the quick shard (see the `plan` job).
  schedule:
    - cron: '30 6 * * *'

# The nightly run has a group of its own, so a push to `main` doesn't cancel it.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

# The repository is public: nothing here may write, and secrets are read only by `release`, which a
# fork's pull request never reaches. Never switch a trigger to `pull_request_target`.
permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  static:
    name: versions, lint, detekt
    # Pinned rather than `-latest`, so an image migration cannot change the build under us.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No setup-java: the ./kotlin wrapper provisions its own JRE and toolchain. This cache holds
      # the toolchain, the JRE, the Maven dependencies (its `.m2.cache`) and the Android SDK components
      # it installs itself. Each job keeps its own, since each downloads a different set and the first
      # to save a key owns it; only `main` saves, as a pull request's cache is visible to that PR alone
      # and would only crowd main's out of the repository's 10 GB.
      - name: Restore the Kotlin toolchain and dependencies
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-static-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: kotlin-static-${{ runner.os }}-

      # A throwaway, so that every load of the project stops warning that signing has no keys.
      - name: A throwaway signing key
        run: sh tools/ci_signing_key.sh

      - name: Android and iOS carry the same version
        run: python3 tools/check_versions.py

      - name: Every module with tests has an iOS test shard
        run: python3 tools/check_ios_shards.py

      - name: The rules for which iOS shards run
        run: python3 tools/ios_test_plan.py --self-test

      - name: Lint
        run: ./kotlin check lint

      - name: Detekt
        run: ./kotlin check detekt

      # detekt.html and detekt.sarif per module, for a failure the log only summarises.
      - name: Attach the detekt reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: build/tasks/_*_detekt@detekt-plugin/
          if-no-files-found: ignore

      - name: Save the Kotlin toolchain and dependencies
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: ${{ steps.cache.outputs.cache-primary-key }}

  check:
    name: build, test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore the Kotlin toolchain and dependencies
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-check-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: kotlin-check-${{ runner.os }}-

      # A throwaway, so that every load of the project stops warning that signing has no keys.
      - name: A throwaway signing key
        run: sh tools/ci_signing_key.sh

      # Platform-filtered because a bare build would reach for the iOS targets, which need macOS.
      - name: Build
        run: ./kotlin build -p jvm -p android

      # -p android as well as -p jvm: the android fragment's tests are plain JVM unit tests.
      - name: Test
        run: ./kotlin test -p jvm -p android

      # JUnit XML per module and platform, for a failure the log only summarises.
      - name: Attach the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: build/reports/
          if-no-files-found: ignore

      - name: Save the Kotlin toolchain and dependencies
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: ${{ steps.cache.outputs.cache-primary-key }}

  ios:
    name: build (ios)
    runs-on: macos-15
    # A cold run downloads Kotlin/Native and its LLVM before the first link.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Restore the Kotlin toolchain and dependencies
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-ios-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: kotlin-ios-${{ runner.os }}-

      # A throwaway, so that every load of the project stops warning that signing has no keys.
      - name: A throwaway signing key
        run: sh tools/ci_signing_key.sh

      # The only place the app's Kotlin/Native link runs in CI, which is where module-wide opt-ins and
      # expect/actual gaps fail. The simulator's link fails on what the device's would, at half the
      # cost of building both. Built unsigned: the project sets no DEVELOPMENT_TEAM. Its one warning,
      # that `Ui_graphicsPathSegment.Type_` could not be mapped, is Compose's: Swift's importer cannot
      # name a nested class `Type`, and nothing here can rename it.
      - name: Build the iOS app
        run: ./kotlin build -m iosApp -p iosSimulatorArm64

      - name: Save the Kotlin toolchain and dependencies
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Which iOS test shards this run needs. Linking a test binary takes minutes on a macOS runner, so a
  # push runs only the quick shard (the pure domains) unless it changes iOS code or the build;
  # tools/ios_test_plan.py has the rules. The JVM and Android tests run every module's common tests anyway.
  plan:
    name: plan (ios tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a push's `before` may be far behind, and a shallow clone can't diff it.
          fetch-depth: 0

      # A failed diff (a new branch, a force push past `before`) prints nothing, which runs every shard.
      - name: Pick the shards
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          { git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null || true; } |
            python3 tools/ios_test_plan.py "$EVENT" "$GITHUB_REF" | tee -a "$GITHUB_OUTPUT"

  ios-test:
    name: test (ios ${{ matrix.shard }})
    needs: plan
    # Each module's tests link a Kotlin/Native binary, minutes apiece on this runner's three cores,
    # so one job running all sixteen outlasts any sensible timeout. Each shard is a line of
    # tools/ios-test-shards.txt: the first, the quick shard, runs on every push; the rest group modules
    # by the part of the tree they compile, as most of a shard's time is its first, cold compile. A full
    # run is five shards beside the app's build, one more than the five macOS runners a public repository
    # gets at once, so one shard waits for the quick shard or the build to finish; three full shards time
    # out. check_ios_shards.py keeps the file covering every module with tests.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The app build's cache, restored only: what the tests need beyond it is a few small klibs.
      - name: Restore the Kotlin toolchain and dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-ios-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: kotlin-ios-${{ runner.os }}-

      # A throwaway, so that every load of the project stops warning that signing has no keys.
      - name: A throwaway signing key
        run: sh tools/ci_signing_key.sh

      # Each module's test binary links in a JVM of its own, up to 1.7 GB, and one
      # `test -p iosSimulatorArm64` links all of them at once, which swaps the 7 GB runner until the
      # job times out; two at a time peak under 4 GB. xargs runs every pair and fails the step if
      # any failed.
      - name: Test on the iOS simulator target
        run: |
          sed -n '${{ matrix.shard }}p' tools/ios-test-shards.txt | tr ' ' '\n' | grep . |
            xargs -n 2 sh -c './kotlin test -p iosSimulatorArm64 $(printf -- "-m %s " "$@")' _

      # The toolchain's logs: the iOS tests write no XML reports.
      - name: Attach the test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-ios-${{ matrix.shard }}
          path: build/logs/
          if-no-files-found: ignore

  # The one check to require before merging: it passes only when every job above passed, so the rule
  # holds however the shards change.
  ci:
    name: CI
    if: always()
    needs: [static, check, plan, ios, ios-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}

  release:
    name: signed bundle (android)
    # Only a version tag (`git tag v0.2.0 && git push origin v0.2.0`), and only once the checks pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Before anything is signed: a bundle named for a tag that is not its versionName is a mistake.
      - name: The tag is the version
        run: python3 tools/check_versions.py --tag "${{ github.ref_name }}"

      # The Linux build's cache, which holds the Android SDK; restored only, never saved from a tag.
      - name: Restore the Kotlin toolchain and dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-check-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: kotlin-check-${{ runner.os }}-

      # The keystore and its passwords are repository secrets: ANDROID_KEYSTORE_BASE64 is
      # `base64 < release.keystore`, the other three are the matching keystore.properties values.
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > androidApp/keystore.properties

      # R8 runs here (release variant, minified and shrunk); androidApp/proguard-rules.pro is read if present.
      - name: Package the signed release bundle
        run: ./kotlin package -m androidApp

      # A workflow artifact, not a GitHub Release: the repository is public and the bundle is for Play.
      - name: Attach the bundle
        uses: actions/upload-artifact@v7
        with:
          name: interval-${{ github.ref_name }}.aab
          path: build/tasks/_androidApp_bundleAndroid/*.aab
          if-no-files-found: error
