name: CI

# All branches, not just `main`: jj pushes feature bookmarks as ordinary branches, and those
# should get a run before they are merged.
on:
  push:
    branches: ['**']
    # A version tag also packages the signed Android bundle (the `release` job).
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  check:
    name: lint, build, test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No setup-java: the ./kotlin wrapper provisions its own JRE and toolchain. This cache holds
      # the toolchain, the JRE and the Android SDK components the toolchain installs itself.
      - name: Cache Kotlin toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      - name: Android and iOS carry the same version
        run: python3 tools/check_versions.py

      - name: Lint
        run: ./kotlin check lint

      - name: Detekt
        run: ./kotlin check detekt

      # Platform-filtered because a bare build would reach for the iOS targets, which need macOS.
      - name: Build
        run: ./kotlin build -p jvm -p android

      # -p android as well as -p jvm: the android fragment's tests are plain JVM unit tests.
      - name: Test
        run: ./kotlin test -p jvm -p android

  ios:
    name: build, test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Kotlin toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      # The only place the Kotlin/Native link runs in CI, which is where module-wide opt-ins and
      # expect/actual gaps fail. Built unsigned: the project sets no DEVELOPMENT_TEAM.
      - name: Build the iOS app
        run: ./kotlin build -m iosApp

      - name: Test on the iOS simulator target
        run: ./kotlin test -p iosSimulatorArm64

  release:
    name: signed bundle (android)
    # Only a version tag (`git tag v0.2.0 && git push origin v0.2.0`), and only once the checks pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Kotlin toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      # The keystore and its passwords are repository secrets: ANDROID_KEYSTORE_BASE64 is
      # `base64 < release.keystore`, the other three are the matching keystore.properties values.
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > androidApp/keystore.properties

      # R8 runs here (release variant, minified and shrunk); androidApp/proguard-rules.pro is read if present.
      - name: Package the signed release bundle
        run: ./kotlin package -m androidApp

      - name: Attach the bundle
        uses: actions/upload-artifact@v4
        with:
          name: interval-${{ github.ref_name }}.aab
          path: build/tasks/_androidApp_bundleAndroid/*.aab
          if-no-files-found: error
