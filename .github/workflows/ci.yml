name: CI

# `main`, version tags and pull requests. A jj bookmark pushed without a PR gets no run of its own:
# start one from the Actions tab or with `gh workflow run CI --ref <bookmark>`. Pushing every branch
# as well as its PR ran everything twice.
on:
  push:
    branches: [main]
    # A version tag also packages the signed Android bundle (the `release` job). Path filters are not
    # evaluated for tags, so a tag always runs.
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'journeys/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'journeys/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The repository is public: nothing here may write, and secrets are read only by `release`, which a
# fork's pull request never reaches. Never switch a trigger to `pull_request_target`.
permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  static:
    name: versions, lint, detekt
    # Pinned rather than `-latest`, so an image migration cannot change the build under us.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No setup-java: the ./kotlin wrapper provisions its own JRE and toolchain. This cache holds
      # the toolchain, the JRE and the Android SDK components the toolchain installs itself.
      - name: Cache Kotlin toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      - name: Android and iOS carry the same version
        run: python3 tools/check_versions.py

      - name: Lint
        run: ./kotlin check lint

      - name: Detekt
        run: ./kotlin check detekt

      # detekt.html and detekt.sarif per module, for a failure the log only summarises.
      - name: Attach the detekt reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: build/tasks/_*_detekt@detekt-plugin/
          if-no-files-found: ignore

  check:
    name: build, test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache Kotlin toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      # Platform-filtered because a bare build would reach for the iOS targets, which need macOS.
      - name: Build
        run: ./kotlin build -p jvm -p android

      # -p android as well as -p jvm: the android fragment's tests are plain JVM unit tests.
      - name: Test
        run: ./kotlin test -p jvm -p android

  ios:
    name: build, test (macos)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache Kotlin toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      # The only place the Kotlin/Native link runs in CI, which is where module-wide opt-ins and
      # expect/actual gaps fail. Built unsigned: the project sets no DEVELOPMENT_TEAM.
      - name: Build the iOS app
        run: ./kotlin build -m iosApp

      - name: Test on the iOS simulator target
        run: ./kotlin test -p iosSimulatorArm64

  release:
    name: signed bundle (android)
    # Only a version tag (`git tag v0.2.0 && git push origin v0.2.0`), and only once the checks pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Before anything is signed: a bundle named for a tag that is not its versionName is a mistake.
      - name: The tag is the version
        run: python3 tools/check_versions.py --tag "${{ github.ref_name }}"

      - name: Cache Kotlin toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      # The keystore and its passwords are repository secrets: ANDROID_KEYSTORE_BASE64 is
      # `base64 < release.keystore`, the other three are the matching keystore.properties values.
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > androidApp/keystore.properties

      # R8 runs here (release variant, minified and shrunk); androidApp/proguard-rules.pro is read if present.
      - name: Package the signed release bundle
        run: ./kotlin package -m androidApp

      # A workflow artifact, not a GitHub Release: the repository is public and the bundle is for Play.
      - name: Attach the bundle
        uses: actions/upload-artifact@v7
        with:
          name: interval-${{ github.ref_name }}.aab
          path: build/tasks/_androidApp_bundleAndroid/*.aab
          if-no-files-found: error
