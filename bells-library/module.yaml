# The exercise library: every exercise to search and narrow, each one's page and cues, the editor for the
# user's own, and the picker the session and the program editor open.
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/compose-lib.module-template.yaml

dependencies:
  - //bells-data: exported
  - //bells-ui: exported

test-dependencies:
  - //bells-testing

settings:
  compose:
    resources:
      packageName: dev.justinsmith.bells.library.resources
