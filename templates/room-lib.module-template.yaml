# A library with a Room database: the runtime and the bundled SQLite driver, the flag Room's KSP-generated
# `actual object XDatabaseConstructor` needs, and JSON for what the database stores as text. The KSP
# processor and `room.schemaLocation` stay in the module's own file: the schemas path is the module's.
dependencies:
  # Exported: the database builder a platform supplies is a Room type.
  - $libs.androidx.room.runtime: exported
  - $libs.androidx.sqlite.bundled

settings:
  kotlin:
    # Room's KMP database constructor is an `expect object` whose `actual` KSP generates, and expect/actual
    # classes still warn as Beta. The flag only silences that warning, so it is safe in the native cache
    # build of dependencies too (see lib.module-template.yaml on `optIns`).
    freeCompilerArgs: [-Xexpect-actual-classes]
    serialization: json
