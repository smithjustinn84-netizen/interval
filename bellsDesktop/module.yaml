product: jvm/app

dependencies:
  - //bells
  - $compose.desktop.currentOs
  # Dispatchers.Main (the Swing EDT) for viewModelScope; see desktopApp/module.yaml.
  - $libs.kotlinx.coroutines.swing

settings:
  compose: enabled
  jvm:
    mainClass: dev.justinsmith.bells.MainKt
  kotlin:
    allWarningsAsErrors: true

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
