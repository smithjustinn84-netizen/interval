# The workout's shared words and widgets: a configuration described, the field rows, steppers and value
# sheets, the timeline, the weekday form, the activity sheet, the Start button; and the app's intro with its
# mark, which About draws too.
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/compose-lib.module-template.yaml

dependencies:
  - //interval-domain: exported

settings:
  compose:
    resources:
      packageName: dev.justinsmith.interval.ui.resources
