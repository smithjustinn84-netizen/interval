product: jvm/amper-plugin

dependencies:
  - $libs.ktlint.rule.engine
  - $libs.ktlint.ruleset.standard
  # ktlint's rules log through kotlin-logging, which binds to slf4j at class-init time.
  - $libs.slf4j.nop

pluginInfo:
  settingsClass: dev.justinsmith.interval.lint.Settings

settings:
  kotlin:
    allWarningsAsErrors: true

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
