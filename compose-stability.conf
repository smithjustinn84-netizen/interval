// What the Compose compiler may take as stable though it never compiled it: the pure modules have no Compose, so
// without this every type of theirs, and every List, is compared by instance, and a screen handed a list rebuilt
// with the same contents recomposes all the same. Listed, a parameter is compared by equals and skips.
// Each entry must stay immutable: no public var, no mutable collection or array held, no open class or interface
// whose implementations could be. Passed by `stabilityConfigurationPath` in every module that enables Compose.

// Read-only collections and ranges. Nothing in the app hands a mutable one to state and changes it after.
kotlin.collections.*
kotlin.ranges.IntRange

// The pure domains: data, sealed and enum types, and the clocks' plain values (interval-domain, core-time,
// lift-domain).
dev.justinsmith.interval.timer.*
dev.justinsmith.interval.model.*
dev.justinsmith.lift.domain.*

// What the pure layers hand the screens besides (core-platform, lift-api); their interfaces stay out.
dev.justinsmith.interval.platform.HeartRate
dev.justinsmith.lift.data.SportDay
dev.justinsmith.lift.data.IntervalWorkout
