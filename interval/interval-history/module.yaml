# History: the training log, calendar and summaries, a finished workout's page, and the plan (the weekly
# goal, the routine by weekday and one-offs), which the log shows and the plan page edits. And Today, the first
# tab, which reads the same log: this week, what is up next, and the presets that fit a few minutes.
description: "Today, History and Plan, with plan reminders"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/compose-lib.module-template.yaml

dependencies:
  - //interval/interval-data: exported
  - //interval/interval-ui: exported
  # The plan's reminders: the platform's notifications.
  - //interval/interval-platform-api
  # History shows Lift's sessions and the program's day too.
  - //lift/lift-api
  - //lift/lift-domain
  - //lift/lift-ui

test-dependencies:
  - //interval/interval-testing
  - //lift/lift-testing

settings:
  compose:
    resources:
      packageName: dev.justinsmith.interval.history.resources
