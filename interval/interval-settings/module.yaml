# Settings: cues, the get-ready countdown, keep screen on, calories, the health store, the plan's goal and
# reminder as they stand, theme, export and import, and the way to About.
description: "Settings: its groups, the weight sheet, export and import"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/compose-lib.module-template.yaml

dependencies:
  - //interval/interval-platform-api
  - //interval/interval-data
  - //interval/interval-ui: exported

test-dependencies:
  - //interval/interval-testing

settings:
  compose:
    resources:
      packageName: dev.justinsmith.interval.settings.resources
