# What a workout needs from the platform, built: the cue player (beeps, speech, haptics) and the words it speaks,
# the workout kept off screen (Android's foreground service and notification, iOS's scheduled
# notifications), the plan's reminders, and the Koin module each platform builds them in, with its storage
# locations. It implements `interval-platform-api`, which the features take; only the app depends on this.
description: "Interval platform services: cues, background workout, plan reminders"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/tested-lib.module-template.yaml
  - //templates/compose-stability.module-template.yaml

dependencies:
  - //interval/interval-platform-api: exported
  # `PlatformStorage`, the files the data module opens, which each platform module binds.
  - //interval/interval-data
  # The clocks, and Android's notification helpers. Not `core`: the notification's colours come in as ARGB.
  - //core/core-platform
  # The cues', the notifications' and the reminders' words.
  - $compose.runtime
  - $compose.components.resources
  - $libs.koin.core
  - $libs.kermit

dependencies@android:
  # NotificationCompat and ContextCompat, for the workout's and the plan's notifications.
  - $libs.androidx.core.ktx
  # The plan reminders' alarm record, a DataStore of its own the boot receiver reads.
  - $libs.androidx.datastore.preferences.core

test-dependencies:
  - //interval/interval-testing

settings:
  compose:
    enabled: true
    resources:
      packageName: dev.justinsmith.interval.platform.resources
