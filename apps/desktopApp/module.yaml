description: "Desktop (JVM) host"
product: jvm/app

dependencies:
  - //apps/app
  # `initAppKoin` hands back the container, which `main` closes as the window does.
  - $libs.koin.core
  - $compose.desktop.currentOs
  - $compose.preview
  # Supplies Dispatchers.Main (the Swing EDT) on the JVM. Without it every `viewModelScope.launch`
  # throws "Module with the Main dispatcher is missing" at runtime.
  - $libs.kotlinx.coroutines.swing

settings:
  compose: enabled
  jvm:
    mainClass: dev.justinsmith.interval.MainKt
  kotlin:
    allWarningsAsErrors: true

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
