description: "iOS host: Xcode project, launch assets"
product: ios/app

apply:
  - //templates/compose-stability.module-template.yaml

dependencies:
  - //apps/app
  - $compose.ui

settings:
  compose: enabled
  kotlin:
    allWarningsAsErrors: true

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
