description: "Android host: manifest, resources, R8, signing"
product: android/app

dependencies:
  - //apps/app
  # `IntervalApplication` starts the container, whose type `initAppKoin` hands back.
  - $libs.koin.core
  - $libs.androidx.activity.compose
  - $libs.androidx.core.splashscreen
  # The home-screen widget (src/widget/): the week's ring and its Workout and Lift buttons.
  - $libs.androidx.glance.appwidget

settings:
  compose: enabled
  android:
    namespace: dev.justinsmith.interval
    applicationId: dev.justinsmith.interval
    # Pinned rather than left to the toolchain's defaults, so a toolchain upgrade cannot silently
    # move the SDK level the app is compiled and tested against.
    compileSdk: 37
    targetSdk: 37
    minSdk: 26
    # Bump versionCode before every Play upload; versionName is the release in CHANGELOG.md.
    # tools/check_versions.py keeps both equal to the iOS project's.
    versionCode: 4
    versionName: "0.4.0"
    # Signs the release AAB (`./kotlin package -m androidApp`) with apps/androidApp/keystore.properties
    # (gitignored: storeFile, storePassword, keyAlias, keyPassword). CI writes it from secrets.
    signing: enabled
  kotlin:
    allWarningsAsErrors: true

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
