# Presets: the built-in and saved shapes of a workout, the sheet that starts one, and the editor the Timer
# and a workout's summary open to save the current settings.
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/compose-lib.module-template.yaml

dependencies:
  - //interval-data: exported
  - //interval-ui: exported

test-dependencies:
  - //interval-testing

settings:
  compose:
    resources:
      packageName: dev.justinsmith.interval.presets.resources
