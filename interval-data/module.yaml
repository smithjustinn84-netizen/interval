# Interval's storage: `IntervalRepository`, the only thing that touches it; the Room database (`interval.db`,
# schemas in `schemas/`) and the settings DataStore behind its mappers; `PlatformStorage`, where a platform
# puts the files; and the Koin modules that build them. Room's KSP runs here and nowhere else on this side.
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/tested-lib.module-template.yaml
  - //templates/room-lib.module-template.yaml

dependencies:
  - //interval-domain: exported
  - //core
  - $libs.androidx.datastore.preferences.core
  - $libs.koin.core
  - $libs.kermit

test-dependencies:
  - //interval-testing

settings:
  kotlin:
    ksp:
      processors:
        - $libs.androidx.room.compiler
      processorOptions:
        room.schemaLocation: ./schemas
