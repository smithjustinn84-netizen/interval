# Lift's storage: its Room database (`bells.db`; schemas in `schemas/`), a repository per store the Lift screens
# take under `LiftRepository`, and its Koin modules. The ports between the sides (`IntervalActivity`, `LiftActivity`) are
# `lift-api`'s, which it exports. No Compose: what it
# needs from the platform (the database builder, the timers' beeper and keep-alive) is in `lift-platform`, behind `lift-platform-api`.
# Room's KSP runs here and nowhere else on the Lift side.
description: "Lift storage: a repository per store over Room; exports lift-api's ports"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/tested-lib.module-template.yaml
  - //templates/room-lib.module-template.yaml

dependencies:
  - //lift/lift-domain: exported
  # Exported: `SessionRepository` is the `LiftActivity` port, and Lift's screens take `IntervalActivity`.
  - //lift/lift-api: exported
  - //core/core-platform
  - $libs.koin.core
  - $libs.kermit

test-dependencies:
  - //lift/lift-testing

settings:
  kotlin:
    ksp:
      processors:
        - $libs.androidx.room.compiler
      processorOptions:
        room.schemaLocation: ./schemas
