# Bells' storage over lists, a beeper that records, and the rest of the app as Lift sees it, for every Lift
# module's tests and the app's. (The toolchain shares no test sources between modules, so this is a library.)
description: "Lift fakes for tests"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/lib.module-template.yaml

dependencies:
  - //lift/lift-platform: exported
  # `WallClock` and `TimestampFormatter`, which the container is given.
  - //core/core-platform
  - //core/core-testing: exported
  - $libs.koin.core
