# The Lift tab: this week, the last session, the program followed and Start session; and the gear owned,
# bells, bar and bands, with the records set.
description: "Lift tab and the gear"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
