# What Lift needs from the platform: the timers' `Beeper` (core's tones, through its `TonePlayer`), the `SessionKeepAlive` for a rest, an EMOM or a hold
# with the app off screen (Android's `TimerService` and its notification, iOS's scheduled notification), and the Koin module each
# platform builds them in, with the database file's location. Lift's counterpart of `interval-platform`, so
# `lift-data` stays free of Compose and its Room KSP reruns only when storage changes.
description: "Lift platform services: the timers' beeper and keep-alive"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/lib.module-template.yaml

dependencies:
  # Exported: the platform module supplies `RoomDatabase.Builder<LiftDatabase>`.
  - //lift/lift-data: exported
  # `epochMillisNow`, `formatClock`, Android's notification helpers, and the tones the timers beep in.
  - //core/core-platform
  # The platform module is built in composition, because Android's database builder needs a `Context`.
  - $compose.runtime
  - $compose.ui
  # The timers' notification's words.
  - $compose.components.resources
  - $libs.koin.core
  - $libs.kermit

dependencies@android:
  # NotificationCompat, for the timers' foreground service.
  - $libs.androidx.core.ktx

settings:
  # For the composable platform module and the timers' notification's strings; no UI of its own.
  compose:
    enabled: true
    resources:
      packageName: dev.justinsmith.lift.platform.resources
