# Interval's storage over lists and in memory, a cue player and a background workout that record, and the
# presets tests lean on, for every Interval module's tests and the app's. (The toolchain shares no test
# sources between modules, so this is a library.)
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/lib.module-template.yaml

dependencies:
  - //interval-platform: exported
  - //core-testing: exported
  - //core-platform
  - $libs.androidx.datastore.preferences.core
  - $libs.koin.core
