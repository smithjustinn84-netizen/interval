product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

dependencies:
  # The theme, components and platform hooks every app shares; exported so the app shells see them too.
  - ../core: exported
  - $compose.runtime
  - $compose.foundation: exported
  - $compose.material3: exported
  - $libs.compose.material3.navigation.suite
  - $libs.compose.material3.adaptive.navigation3
  - $libs.composeunstyled.dialog
  - $libs.composeunstyled.dropdown.menu
  - $libs.composeunstyled.modal.bottom.sheet
  - $libs.composeunstyled.text.field
  - $libs.composeunstyled.toggle.switch
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel: exported
  - $libs.androidx.lifecycle.viewmodel.compose: exported
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.navigation3
  - $libs.androidx.navigation3.runtime
  - $libs.androidx.navigation3.ui
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.kermit
  - $libs.androidx.room.runtime
  - $libs.androidx.sqlite.bundled
  - $libs.androidx.datastore.preferences.core

test-dependencies:
  - $libs.kotlinx.coroutines.test

# Compose UI tests run on the desktop JVM only: common `test/` also runs as Android local tests,
# which have no Robolectric here, so `runComposeUiTest` lives in `test@jvm/`.
test-dependencies@jvm:
  - $compose.uiTest
  # Skiko's native renderer; without it `runComposeUiTest` fails with LibraryLoadException.
  - $compose.desktop.currentOs
  # Dispatchers.Main for viewModelScope, as in desktopApp: the tests compose the real routes.
  - $libs.kotlinx.coroutines.swing

# Renders the shared @Preview functions in the IDE. Amper has no debug-only dependency scope, so it ships
# in release builds too; R8 strips what the app never calls.
dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: dev.justinsmith.interval.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    allWarningsAsErrors: true
    # Room's KMP database constructor is an `expect object` whose `actual` KSP generates, and
    # expect/actual classes still warn as Beta. The flag only silences that warning, so it is safe in
    # the native cache build of dependencies too (see the note on `optIns` below).
    freeCompilerArgs: [-Xexpect-actual-classes]
    serialization: json
    ksp:
      processors:
        - $libs.androidx.room.compiler
      processorOptions:
        room.schemaLocation: ./schemas
    # No module-wide `optIns`: opt in per file (`@file:OptIn`). Since toolchain 0.13 the module's
    # flags reach the native compiler-cache build of every dependency, where a marker the library
    # cannot see is an "unresolved" warning, which allWarningsAsErrors turns into a failed iOS link.

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
