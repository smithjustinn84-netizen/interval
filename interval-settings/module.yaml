# Settings: cues, the get-ready countdown, keep screen on, theme, body and units.
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/compose-lib.module-template.yaml

dependencies:
  - //interval-platform: exported
  - //interval-ui: exported

test-dependencies:
  - //interval-testing

settings:
  compose:
    resources:
      packageName: dev.justinsmith.interval.settings.resources
