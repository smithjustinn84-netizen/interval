# The fakes every module's tests share. The toolchain has no test fixtures (a module's tests can't see
# another's `test/`), so this is an ordinary library that modules list under `test-dependencies`.
# `MainDispatcherTest`, `FixedTimestampFormatter`, `FakeAppInfo`, the tests' calendar. No Compose, so the pure
# layers' tests link none: the Compose UI harness is `core-ui-testing`.
description: "Test helpers: dispatcher, fixed clock and formatter, the platform's fakes"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/lib.module-template.yaml

dependencies:
  # What the fakes stand in for (`WallClock`, `Sharer`, `HealthStore`, …).
  - //core/core-platform
  - $kotlin.test: exported
  - $libs.kotlinx.coroutines.test: exported
  # `fakeCorePlatformModule`, which stands in for core's `corePlatformModule`.
  - $libs.koin.core

# `kotlin.test.BeforeTest` on the JVM and Android is JUnit's annotation, which only the JUnit flavour carries.
dependencies@android:
  - $kotlin.test.junit5: exported

dependencies@jvm:
  - $kotlin.test.junit5: exported
