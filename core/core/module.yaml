# What Interval and its sibling apps share: the theme and tokens, motion, the page, sheet, dialog and
# button components, the lanes artwork, the platform hooks the UI needs, and (from `core-platform`, exported)
# the clocks, the timestamp formatter, a repository's plumbing and calendar and clock maths. Nothing here
# knows about workouts' storage or an app's screens.
description: "Design system: theme, tokens, motion, components, navigation primitives"
product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

dependencies:
  - //core/core-platform: exported
  - //core/core-time: exported
  - $compose.runtime
  - $compose.foundation: exported
  - $compose.material3: exported
  - $libs.compose.material3.navigation.suite: exported
  - $libs.compose.material3.adaptive.navigation3
  - $libs.composeunstyled.dialog
  - $libs.composeunstyled.dropdown.menu
  - $libs.composeunstyled.modal.bottom.sheet
  - $libs.composeunstyled.text.field
  - $libs.composeunstyled.toggle.switch
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $libs.androidx.navigation3.runtime
  - $libs.androidx.navigation3.ui: exported
  - $libs.kermit
  # `rememberCorePlatformModule`: the clock, formatter, app info and sharer both sides' containers take.
  - $libs.koin.core

test-dependencies:
  - $libs.kotlinx.coroutines.test

dependencies@android:
  - $compose.uiTooling
  # `LifecycleResumeEffect`, for a setting read again as the app comes back.
  - $libs.androidx.lifecycle.runtime.compose
  # FileProvider, for the share sheet to read an exported file.
  - $libs.androidx.core.ktx

settings:
  compose:
    enabled: true
    resources:
      packageName: dev.justinsmith.core.resources
      exposedAccessors: true
  kotlin:
    allWarningsAsErrors: true
    # No module-wide `optIns`: opt in per file (`@file:OptIn`). See apps/app/module.yaml.

plugins:
  lint-plugin:
    enabled: true
  detekt-plugin:
    enabled: true
